name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip project files
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE"
          fi

      - name: Auto Fix Layout Error
        run: |
          find . -name "activity_main.xml" -exec sed -i 's/android:hintTextColor/android:textColorHint/g' {} +

      - name: Auto Fix Repositories (Fix Error 429)
        run: |
          find . -name "build.gradle" -exec sed -i 's|https://repo.maven.apache.org/maven2|https://repo1.maven.org/maven2|g' {} +
          find . -name "settings.gradle" -exec sed -i 's|https://repo.maven.apache.org/maven2|https://repo1.maven.org/maven2|g' {} +

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK with Gradle
        run: |
          GRADLE_EXEC=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLE_EXEC" ]; then
            chmod +x $GRADLE_EXEC
            $GRADLE_EXEC assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TX_Robot_AI_App
          path: '**/*.apk'
